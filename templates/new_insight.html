<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ event_subject }} — insights</title>
    <link rel="stylesheet" href="/static/styles/insights.css">
</head>
<body>
{% include "_top.html" %}
    <main>
        <h1 class="rise">{{ event_subject }}</h1>

        <form id="insightForm" class="rise">
            <label class="card" for="insight">
                <textarea id="insight" name="insight" placeholder="What stayed with you?" maxlength="2000" required></textarea>
                <span class="card-foot"><span id="count">0</span> / 2000</span>
            </label>
            <button type="submit" class="btn" id="submit" disabled>
                Add to the deck
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
            <p class="form-note" id="error" hidden>Couldn't save it. Try again.</p>
        </form>

        <section id="done" hidden>
            <div class="card">
                <p class="card-text" data-size="xl">Added to the deck.</p>
            </div>
            <button type="button" class="btn btn-ghost" id="again">Write another one</button>
        </section>
    </main>
</div>
<script>
    const form = document.getElementById("insightForm");
    const input = document.getElementById("insight");
    const submit = document.getElementById("submit");
    const errorNote = document.getElementById("error");
    const done = document.getElementById("done");

    input.addEventListener("input", () => {
        document.getElementById("count").textContent = input.value.length;
        submit.disabled = input.value.trim().length === 0;
    });

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        submit.disabled = true;
        errorNote.hidden = true;
        try {
            const response = await fetch("{{ host }}/api/v1/insight", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ event_id: "{{ event_id }}", insight: input.value.trim() })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            form.hidden = true;
            done.hidden = false;
        } catch (err) {
            console.error(err);
            errorNote.hidden = false;
            submit.disabled = false;
        }
    });

    document.getElementById("again").addEventListener("click", () => {
        input.value = "";
        input.dispatchEvent(new Event("input"));
        done.hidden = true;
        form.hidden = false;
        input.focus();
    });
</script>
</body>
</html>
