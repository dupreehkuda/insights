<script>
    // device theme by default; a manual pick lasts only for this visit
    const mq = matchMedia("(prefers-color-scheme: light)");
    const applyTheme = () => document.documentElement.dataset.theme = sessionStorage.theme || (mq.matches ? "light" : "dark");
    applyTheme();
    mq.addEventListener("change", applyTheme);
</script>
<div class="aurora"></div>
<div class="shell">
    <header class="top rise">
        <span class="wordmark">insights</span>
        <button class="theme" id="theme" type="button" aria-label="Toggle theme">
            <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
    </header>
    <dialog class="modal" id="welcome" aria-labelledby="welcomeTitle">
        <div class="modal-body">
            <span class="modal-tag">New</span>
            <h2 id="welcomeTitle">Design update just landed</h2>
            <p>We gave insights a fresh look. We're still polishing it, so enjoy and tell us what feels off.</p>
            <button type="button" class="btn" id="welcomeOk" autofocus>Let's go</button>
        </div>
    </dialog>
    <script>
        document.getElementById("theme").addEventListener("click", () => {
            sessionStorage.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            applyTheme();
        });

        const welcome = document.getElementById("welcome");
        if (!localStorage.seenRedesign) {
            const dismiss = () => { localStorage.seenRedesign = "1"; welcome.close(); };
            setTimeout(() => welcome.showModal(), 500);
            document.getElementById("welcomeOk").addEventListener("click", dismiss);
            welcome.addEventListener("click", (e) => { if (e.target === welcome) dismiss(); });
            document.addEventListener("keydown", (e) => { if (e.key === "Escape" && welcome.open) dismiss(); });
            welcome.addEventListener("cancel", dismiss);
        }
    </script>
