<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ event_subject }} — insights</title>
    <link rel="stylesheet" href="/static/styles/insights.css">
</head>
<body>
{% include "_top.html" %}
    <main>
        <h1 class="rise">{{ event_subject }}</h1>

        {% if insights.is_empty() %}
        <p class="deck-empty rise">The deck is empty.</p>
        {% else %}
        <div class="deck rise" id="deck">
            {% for item in insights %}
            <article class="card"><p class="card-text">{{ item }}</p></article>
            {% endfor %}
        </div>

        <div class="wall" id="wall" hidden>
            {% for item in insights %}
            <div class="mini" style="--d: {{ loop.index0 }}">{{ item }}</div>
            {% endfor %}
        </div>

        <div class="progress rise"><i id="bar"></i></div>
        <div class="controls rise">
            <button class="nav" id="prev" aria-label="Previous card">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            </button>
            <div class="counter"><span id="cur">1</span><small>of</small><span id="total">{{ insights.len() }}</span></div>
            <button class="nav" id="next" aria-label="Next card">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
        </div>
        {% endif %}
    </main>
</div>
<script>
    const deck = document.getElementById("deck");
    if (deck) {
        const cards = [...deck.querySelectorAll(".card")];
        const prev = document.getElementById("prev");
        const next = document.getElementById("next");
        const cur = document.getElementById("cur");
        let i = 0;
        let tilt = "";

        // bigger type for shorter cards
        for (const c of cards) {
            const n = c.textContent.trim().length;
            c.firstElementChild.dataset.size = n < 90 ? "xl" : n < 220 ? "lg" : "md";
        }

        const wall = document.getElementById("wall");
        const last = cards.length; // index of the summary wall

        // desktop wall: shuffle the cards over the whole screen, random size, overlapping
        const minis = [...wall.children];
        const rand = (a, b) => a + Math.random() * (b - a);
        function scatter() {
            const wide = matchMedia("(min-width: 900px)").matches;
            wall.classList.toggle("scatter", wide);
            if (!wide) { minis.forEach((m, k) => m.style.cssText = `--d:${k}`); return; }

            // pack the cards along a spiral from the centre, allowing a little overlap
            const W = innerWidth;
            const top = document.querySelector("h1").getBoundingClientRect().bottom + 8;
            const bottom = document.getElementById("prev").getBoundingClientRect().top - 16;
            const cx = W / 2, cy = (top + bottom) / 2;
            const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
            const overlap = (a, b) => {
                const ix = Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x));
                const iy = Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
                return ix * iy / Math.min(a.w * a.h, b.w * b.h);
            };
            const placed = [];
            const n = minis.length;
            const step = clamp(90 / n, 7, 22);          // few cards spread wider
            const wMax = n < 8 ? 460 : 380;
            minis.slice().sort(() => Math.random() - .5).forEach((m) => {
                // long texts get a wider card and smaller type instead of scrolling
                const long = m.textContent.length > 280;
                const w = Math.min(long ? rand(420, 520) : rand(260, wMax), W - 32);
                const fs = long ? 14 : rand(15, 19);
                m.style.cssText = `--d:${rand(0, 8)}; --r:${rand(-3, 3)}deg; width:${w}px; font-size:${fs}px; z-index:${Math.floor(rand(1, 20))}`;
                const h = m.offsetHeight;
                let x = cx - w / 2, y = cy - h / 2;
                for (let t = 0; t < 300; t += .25) {
                    x = clamp(cx + step * t * Math.cos(t) - w / 2, 16, W - w - 16);
                    y = clamp(cy + step * t * Math.sin(t) * .7 - h / 2, top, Math.max(top, bottom - h));
                    if (placed.every(p => overlap(p, { x, y, w, h }) < .1)) break;
                }
                m.style.left = `${x}px`;
                m.style.top = `${y}px`;
                placed.push({ x, y, w, h });
            });
        }
        addEventListener("resize", () => { if (i === last) scatter(); });

        function layout() {
            const onWall = i === last;
            deck.hidden = onWall;
            wall.hidden = !onWall;
            if (onWall) scatter();
            cards.forEach((c, k) => {
                const d = k - i;
                if (d < 0) {
                    c.dataset.pos = "gone";
                    c.style.transform = "translate3d(-40%, 6%, 120px) rotateZ(-14deg) rotateY(30deg)";
                    c.style.zIndex = 0;
                } else {
                    c.dataset.pos = d === 0 ? "top" : "behind";
                    const off = Math.min(d, 3);
                    c.style.transform = d === 0 ? tilt : `translate3d(0, ${off * 18}px, ${off * -90}px)`;
                    c.style.zIndex = cards.length - d;
                }
            });
            cur.textContent = onWall ? "all" : i + 1;
            document.getElementById("bar").style.width = `${(Math.min(i + 1, last) / last) * 100}%`;
            prev.disabled = i === 0;
            next.disabled = onWall;
        }

        const go = (d) => { i = Math.max(0, Math.min(last, i + d)); layout(); };
        prev.addEventListener("click", () => go(-1));
        next.addEventListener("click", () => go(1));
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
            if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
        });

        // desktop: top card leans toward the pointer
        deck.addEventListener("pointermove", (e) => {
            if (e.pointerType !== "mouse" || !cards[i]) return;
            const r = deck.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width - .5;
            const y = (e.clientY - r.top) / r.height - .5;
            tilt = `rotateY(${x * 8}deg) rotateX(${-y * 8}deg)`;
            cards[i].style.transform = tilt;
        });
        deck.addEventListener("pointerleave", () => { tilt = ""; if (cards[i]) cards[i].style.transform = ""; });

        // touch: the card follows the finger, then snaps or flies; on the wall a swipe just navigates
        const stage = document.querySelector("main");
        let x0 = 0, dx = 0;
        stage.addEventListener("touchstart", (e) => {
            x0 = e.touches[0].clientX; dx = 0;
            if (cards[i]) cards[i].style.transition = "none";
        }, { passive: true });
        stage.addEventListener("touchmove", (e) => {
            dx = e.touches[0].clientX - x0;
            if (cards[i]) cards[i].style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`;
        }, { passive: true });
        stage.addEventListener("touchend", () => {
            const c = cards[i];
            if (c) c.style.transition = "";
            if (dx < -60 && i < last) go(1);
            else if (dx > 60 && i > 0) go(-1);
            else if (c) c.style.transform = "";
        });

        layout();
    }
</script>
</body>
</html>
