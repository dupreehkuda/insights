name: production deploy

on:
  workflow_dispatch:
    inputs:
      deploy_only:
        description: Deploy the currently published image without rebuilding
        type: boolean
        default: false
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ !inputs.deploy_only }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Check link recovery
        run: node --test tests/restore-link.test.mjs

      - name: Set up Docker Buildx
        id: docker_buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push insights image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/insights-prod:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/insights-prod:latest

  deploy-timeweb:
    if: ${{ always() && (needs.build-and-push.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.deploy_only)) }}
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on timeweb
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.TIMEWEB_IP }}
          username: ${{ vars.TIMEWEB_USERNAME }}
          key: ${{ secrets.TIMEWEB_DEPLOY_KEY }}
          script: |
            cd insights
            make deploy
